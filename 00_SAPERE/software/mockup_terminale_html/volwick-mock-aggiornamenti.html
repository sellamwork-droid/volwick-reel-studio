<meta charset="utf-8">
<title>Volwick Sightline — mock aggiornamenti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#080B10;--panel:#0C1017;--panel2:#11161F;--line:#1B2230;--line2:#232B3A;--line3:#2E3849;
 --ink:#F0F3F8;--ink2:#C8D0DC;--mut:#8A94A6;--mut2:#5D6A82;--mut3:#414C60;
 --gold:#E8C268;--grn:#369C6F;--red:#CC5858;--blu:#4C92CC;--vio:#A173CC;--cy:#7FD4E8;
 --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--sans)}
html,body{height:100%}
body{background:#05070A;color:var(--ink);overflow:hidden;font-size:13px}
.wrap{height:100vh;display:flex;flex-direction:column}

/* ── striscia mock (fuori dall'app) ── */
.mk{flex:none;background:#05070A;border-bottom:1px solid #171E2A;padding:7px 12px 8px;
 display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mk .lb{font-size:8.5px;letter-spacing:.2em;color:var(--mut3);margin-right:6px}
.mk button{height:23px;min-width:23px;padding:0 7px;border-radius:5px;border:1px solid #222A38;
 background:transparent;color:var(--mut);font-size:10.5px;cursor:pointer}
.mk button:hover{color:var(--ink2);border-color:#33404F}
.mk button.on{color:#05070A;background:var(--gold);border-color:var(--gold);font-weight:700}
.mk .rs{margin-left:auto;letter-spacing:.13em;font-size:9px}
.note{flex:none;background:rgba(232,194,104,.07);border-bottom:1px solid rgba(232,194,104,.2);
 padding:6px 13px;font-size:11px;color:var(--gold);display:flex;gap:9px;align-items:baseline}
.note b{font-weight:700;flex:none}
.note span{color:var(--ink2)}

.shell{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg);position:relative}
.top{height:34px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.crumb{font-size:11px;color:var(--mut2)}.crumb b{color:var(--ink);font-weight:600}
.push{flex:1}
.htr{height:24px;padding:0 11px;border:1px solid var(--line3);border-radius:6px;background:transparent;
 color:var(--ink2);font-size:9px;letter-spacing:.14em;cursor:pointer}
.conn{display:flex;align-items:center;gap:6px;margin-left:14px;font-size:9px;letter-spacing:.13em;color:var(--mut2)}
.conn i{width:6px;height:6px;border-radius:50%;background:var(--grn)}

.bar{height:44px;display:flex;align-items:center;gap:8px;padding:0 11px;border-bottom:1px solid var(--line);
 background:var(--panel);flex:none;position:relative;z-index:40}
.mark{width:23px;height:23px;border-radius:6px;background:linear-gradient(150deg,#E8C268,#B4923D);
 color:#0A0D13;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
.bdot{width:7px;height:7px;border-radius:50%;border:none;padding:0;cursor:pointer;background:var(--grn)}
.v{display:flex;align-items:center;gap:7px;height:29px;padding:0 9px;border-radius:7px;
 border:1px solid var(--line2);background:#0E131B;font-size:12.5px;color:var(--ink);cursor:pointer}
.v:hover{border-color:var(--line3)}
.v k{font-size:9.5px;letter-spacing:.13em;color:var(--mut);font-weight:600}
.v u{color:var(--mut2);font-size:9px;text-decoration:none}
.v b{font-weight:700}
.tkv{font-weight:700;color:var(--gold);font-size:13px}
.pxv{font-weight:600}.chg{font-size:10.5px}.chg.dn{color:var(--red)}.chg.up{color:var(--grn)}
.sep{width:1px;height:22px;background:var(--line2);margin:0 3px}
.fam{display:flex;gap:7px;padding-left:10px;position:relative}
.fam:before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;border-radius:2px}
.fam.book:before{background:rgba(76,146,204,.55)}
.fam.over:before{background:rgba(232,194,104,.55)}
.chip{height:25px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);background:transparent;
 font-size:10px;letter-spacing:.1em;color:var(--mut);display:flex;align-items:center;gap:6px;cursor:pointer}
.chip:hover{color:var(--ink2)}
.chip.on{color:var(--gold);border-color:rgba(232,194,104,.45);background:rgba(232,194,104,.08)}
.chip i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
.gui{height:25px;padding:0 11px;border-radius:6px;border:1px solid var(--line2);background:transparent;
 font-size:9.5px;letter-spacing:.13em;color:var(--mut);cursor:pointer}
.gui:hover{color:var(--ink2)}
.gui.on{color:var(--gold);border-color:rgba(232,194,104,.5);background:rgba(232,194,104,.08)}

.fly{position:absolute;top:100%;margin-top:7px;background:var(--panel2);border:1px solid var(--line3);
 border-radius:10px;padding:7px;min-width:158px;z-index:90;box-shadow:0 16px 44px rgba(0,0,0,.6)}
.fly h4{font-size:8px;letter-spacing:.18em;color:var(--mut3);padding:5px 8px 7px;font-weight:500}
.opt{display:flex;align-items:center;width:100%;gap:9px;padding:7px 9px;border-radius:6px;border:none;
 background:transparent;color:var(--ink2);font-size:12.5px;cursor:pointer;text-align:left}
.opt:hover{background:rgba(255,255,255,.045)}
.opt[aria-checked=true]{color:var(--gold);background:rgba(232,194,104,.09)}
.opt s{margin-left:auto;font-size:9.5px;color:var(--mut3);text-decoration:none}
.fly hr{border:none;border-top:1px solid var(--line2);margin:5px 6px}
.seg{display:flex;gap:4px;padding:0 3px 3px}
.seg button{flex:1;height:26px;border-radius:6px;border:1px solid var(--line2);background:transparent;
 color:var(--mut);font-size:11px;cursor:pointer}
.seg button[aria-pressed=true]{color:var(--gold);border-color:rgba(232,194,104,.5);background:rgba(232,194,104,.09)}
.trow{display:flex;align-items:center;gap:9px;padding:6px 8px;font-size:11.5px;color:var(--ink2)}
.sw{width:34px;height:19px;border-radius:11px;border:1px solid var(--line3);background:#161C27;position:relative;cursor:pointer}
.sw:after{content:'';position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--mut2);transition:.15s}
.sw[aria-checked=true]{background:rgba(54,156,111,.3);border-color:var(--grn)}
.sw[aria-checked=true]:after{left:17px;background:var(--grn)}
.num{width:66px;height:25px;border-radius:6px;border:1px solid var(--line2);background:#0E131B;color:var(--ink);
 font-size:11.5px;text-align:right;padding:0 7px;margin-left:auto}
.gsel{display:flex;gap:6px;padding:0 4px 4px}
.gsel button{width:37px;height:31px;border:1px solid var(--line2);border-radius:7px;background:transparent;
 display:grid;gap:2px;padding:6px;cursor:pointer}
.gsel button[aria-pressed=true]{border-color:rgba(232,194,104,.6);background:rgba(232,194,104,.08)}
.gsel s{background:var(--mut2);border-radius:1px;display:block}
.gsel button[aria-pressed=true] s{background:var(--gold)}
.g1{grid-template-columns:1fr}.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}

.body{flex:1;display:flex;min-height:0}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.plot{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.pgrid{flex:1;display:grid;gap:1px;background:var(--line);min-height:0}
.pane{background:var(--bg);display:flex;flex-direction:column;min-width:0;overflow:hidden;cursor:pointer}
.pane.act .pbar{box-shadow:inset 3px 0 0 var(--gold)}
.pbar{height:38px;display:flex;align-items:center;gap:7px;padding:0 9px;background:var(--panel);

.pbar .v{height:27px;font-size:12.5px}
.pbar .v k{font-size:9.5px;font-weight:600;color:var(--mut)}

.tbar{height:38px;display:flex;align-items:center;gap:10px;padding:0 11px;border-top:1px solid var(--line);
 background:var(--panel);flex:none}
.mode{display:flex;background:#0E131B;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.mode button{height:25px;padding:0 12px;border:none;background:transparent;color:var(--mut);
 font-size:9.5px;letter-spacing:.12em;cursor:pointer;display:flex;align-items:center;gap:6px}
.mode button.on{color:var(--ink);background:#161D28}
.mode button.on i{width:6px;height:6px;border-radius:50%;background:var(--grn);display:block}
.jump{display:flex;align-items:center;gap:5px}
.jb{width:24px;height:25px;border:1px solid var(--line2);border-radius:6px;background:transparent;color:var(--mut);cursor:pointer}
.jv{height:25px;padding:0 13px;border:1px solid var(--line2);border-radius:6px;background:#0E131B;color:var(--ink);
 font-size:11.5px;cursor:pointer}
.tl{flex:1;position:relative;height:30px}
.tlbar{position:absolute;left:0;right:0;top:9px;height:3px;background:#232B3A;border-radius:2px;cursor:pointer}
.tlfill{position:absolute;left:0;top:0;height:100%;background:var(--gold);border-radius:2px}
.tlknob{position:absolute;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--gold);margin-left:-6px}
.tlt{position:absolute;left:0;right:0;top:17px;display:flex;justify-content:space-between;font-size:8.5px;color:var(--mut3)}
.tlend{position:absolute;left:0;right:0;top:-8px;display:flex;justify-content:space-between;
 font-size:7.5px;letter-spacing:.14em;color:var(--mut3)}

.dock{width:300px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.dhead{height:34px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);
 font-size:9px;letter-spacing:.19em;color:var(--mut)}
.dx{margin-left:auto;background:transparent;border:none;color:var(--mut2);cursor:pointer;font-size:13px}
.dsrc{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);
 background:rgba(232,194,104,.06)}
.dsrc i{width:3px;height:14px;background:var(--gold);border-radius:2px;flex:none}
.dsrc b{font-size:10px;letter-spacing:.13em;color:var(--gold);font-weight:700}
.dsrc span{font-size:8px;color:var(--mut3);margin-left:auto;letter-spacing:.1em}
.dscroll{flex:1;overflow-y:auto;padding:12px}
.dsec{margin-bottom:15px}
.dsec h6{font-size:8px;letter-spacing:.2em;color:var(--mut3);font-weight:500;margin-bottom:8px}
.hero{border:1px solid var(--line2);border-radius:9px;padding:11px;text-align:center;background:#0E131B}
.hero b{display:block;font-size:15px;letter-spacing:.1em;font-weight:700;color:var(--ink)}
.hero span{font-size:9.5px;color:var(--mut2)}
.warn{margin-top:8px;border:1px solid rgba(204,88,88,.3);background:rgba(204,88,88,.07);border-radius:8px;
 padding:9px 10px;font-size:10.5px;color:#E4A3A3;line-height:1.5}
.warn b{color:#fff}
.card{border:1px solid rgba(232,194,104,.22);border-radius:9px;padding:10px;background:rgba(232,194,104,.035)}
.lead{font-size:11.5px;color:var(--gold);font-weight:600;margin-bottom:8px}
.kv{display:flex;gap:9px;font-size:11px;padding:4px 0;line-height:1.45;border-top:1px solid rgba(255,255,255,.045)}
.kv:first-child{border-top:none}
.kv span{color:var(--mut2);flex:none;width:44px;font-size:8.5px;letter-spacing:.14em;padding-top:2px}
.kv b{color:var(--ink2);font-weight:500}
.kv b em{font-style:normal;color:var(--ink);font-weight:700}
.lvl{display:flex;align-items:center;border:1px solid var(--line2);border-radius:7px;padding:8px 10px;
 margin-bottom:5px;background:#0E131B}
.lvl b{font-size:12.5px;font-weight:600}
.lvl span{margin-left:auto;font-size:9px;color:var(--mut2)}
.lvl.sq b{color:var(--cy)}.lvl.mag b{color:var(--grn)}
.lvl.now{border-color:rgba(255,255,255,.28);background:#151B25}.lvl.now b{color:#fff}
.lvl s{font-size:8.5px;color:var(--mut3);text-decoration:none;margin-left:7px}
.empty{border:1px dashed var(--line3);border-radius:9px;padding:16px 12px;text-align:center}
.empty b{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:5px}
.empty span{font-size:10px;color:var(--mut2);line-height:1.6}
.stat{height:26px;display:flex;align-items:center;gap:16px;padding:0 13px;border-top:1px solid var(--line);
 background:var(--panel);font-size:9.5px;color:var(--mut2);flex:none}
.stat b{color:var(--ink2);font-weight:500}

.ask{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:120;width:308px;
 background:var(--panel2);border:1px solid var(--line3);border-radius:12px;padding:13px;
 box-shadow:0 26px 70px rgba(0,0,0,.72)}
.ask h5{font-size:9px;letter-spacing:.18em;color:var(--mut);font-weight:500;margin-bottom:10px}
.aopt{display:flex;align-items:center;width:100%;gap:9px;padding:10px 11px;border-radius:8px;
 border:1px solid var(--line2);background:#0E131B;color:var(--ink2);font-size:12.5px;cursor:pointer;
 margin-bottom:6px;text-align:left}
.aopt em{margin-left:auto;font-style:normal;color:var(--mut2);font-size:11px}
.aopt.sel{border-color:rgba(232,194,104,.55);background:rgba(232,194,104,.09);color:var(--gold)}

.repl{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--line);
 background:#0E131B;flex:none}
.rb{height:23px;padding:0 11px;border-radius:6px;border:1px solid var(--line2);background:transparent;
 color:var(--mut);font-size:9.5px;letter-spacing:.11em;cursor:pointer}
.rb.on{color:var(--gold);border-color:rgba(232,194,104,.5);background:rgba(232,194,104,.08)}
.hint{font-size:9.5px;color:var(--mut3);margin-left:6px}
.sub{border-top:1px solid var(--line);background:#0A0E14;display:flex;flex-direction:column;flex:none}
.subh{height:24px;display:flex;align-items:center;gap:9px;padding:0 11px;font-size:9.5px;color:var(--mut2);flex:none}
.subh b{color:var(--gold);letter-spacing:.13em}
.subh em{font-style:normal;color:var(--grn)}
.pill{height:17px;padding:0 8px;border-radius:5px;border:1px solid var(--line2);background:transparent;
 color:var(--mut);font-size:9px;cursor:pointer}
.pill.on{color:var(--gold);border-color:rgba(232,194,104,.5);background:rgba(232,194,104,.08)}

/* ── tipografia: Plex Sans per il testo, Plex Mono solo per i numeri ── */

body{-webkit-font-smoothing:antialiased;letter-spacing:.005em}
.mk .lb,.note b,.gui,.chip,.dhead,.dsec h6,.fly h4,.dsrc b,.dsrc span,.ask h5,.rb,.mode button,.htr,.conn,.v k,.pill,.subh b{
 font-family:var(--sans);font-weight:600}

</style>
<body><div class="wrap"><div class="mk" id="mk"></div><div class="note" id="nt"></div><div class="shell" id="app"></div></div>
<script>
const GRN='#369C6F',RED='#CC5858',BLU='#4C92CC',VIO='#A173CC',GOLD='#E8C268',CY='#7FD4E8';

/* ─────────────────────────────────────────────────────────
   STRUMENTI — mappa reale dichiarata dall'app
   src  = libro opzioni da cui arrivano i muri
   k,b  = conversione strike del libro -> prezzo dello strumento
   step = passo degli strike nel libro
   ───────────────────────────────────────────────────────── */
const INS={
 SPX :{px:7669.79,ch: 0.32,src:null ,k:1    ,b:0    ,step:5   ,tick:0.01,dec:2,unit:'M',sz:[-98,89,-34,36,29]},
 ES  :{px:7685.00,ch:-0.07,src:'SPX',k:1    ,b:15.21,step:5   ,tick:0.25,dec:2,unit:'M',sz:[-98,89,-34,36,29]},
 MES :{px:7685.25,ch:-0.07,src:'SPX',k:1    ,b:15.21,step:5   ,tick:0.25,dec:2,unit:'M',sz:[-98,89,-34,36,29]},
 NQ  :{px:29288.25,ch:0.11,src:'QQQ',k:41.22,b:0    ,step:1   ,tick:0.25,dec:2,unit:'M',sz:[-118,96,-41,44,31]},
 RTY :{px:3013.90,ch:-0.09,src:'IWM',k:10.00,b:0    ,step:1   ,tick:0.10,dec:2,unit:'M',sz:[-37,31,-13,15,11]},
 VIX :{px:15.66 ,ch:-1.26,src:null ,k:1    ,b:0    ,step:1   ,tick:0.01,dec:2,unit:'M',sz:[-12,9,-4,5,3]},
 VX  :{px:17.24 ,ch:-0.06,src:'VIX',k:1    ,b:0    ,step:1   ,tick:0.05,dec:2,unit:'M',sz:[-12,9,-4,5,3]},
 SPY :{px:765.87,ch: 0.32,src:null ,k:1    ,b:0    ,step:1   ,tick:0.01,dec:2,unit:'B',sz:[-2.3,1.9,-0.8,1.1,0.7]},
 QQQ :{px:710.56,ch: 0.61,src:null ,k:1    ,b:0    ,step:1   ,tick:0.01,dec:2,unit:'B',sz:[-1.4,1.1,-0.5,0.6,0.4]},
 BTC :{px:78665.00,ch:0.49,src:'IBIT',k:1420,b:0   ,step:1.25,tick:1   ,dec:2,unit:'M',sz:[-64,52,-23,26,19]},
 GOLD:{px:4676.20,ch:-0.84,src:'GLD',k:10.86,b:0   ,step:1   ,tick:0.10,dec:2,unit:'M',sz:[-290,240,-105,118,88]}};

const TFS=['1m','5m','15m','1h','4h','D'];
const WALLS=['Off','Top 3','Top 5','Top 10','Top 15','Top 25','Top 40'];
const METR=['GEX','CEX','DEX','ALL'];
const EXP=[['0DTE','90 · 26 Aug'],['This week','136 · 26 – 28 Aug'],['This month','152 · 26 – 31 Aug'],['All','348 strikes']];
const WINS=[{tk:'ES',tf:'1m'},{tk:'SPX',tf:'1m'},{tk:'SPY',tf:'5m'},{tk:'NQ',tf:'1m'}];
const OFFS=[3,2,1,-3,-4];             // muri, in passi di strike
const STARS=[2,1,0,0,0];

let S={tk:'ES',tf:'1m',grid:1,act:0,walls:'Top 5',metric:'GEX',exp:'All',
 tide:1,flow:'Off',thr:100,levels:'Off',cvd:1,cdi:1,maps:1,proj:0,oi:0,
 panels:1,ask:0,open:null,replay:0,playing:0,rt:0.42,demo:0};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(v,d)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const inst=()=>INS[S.tk];
const srcOf=t=>INS[t].src;                       // null = libro proprio

/* muri SEMPRE nella scala dello strumento a schermo (punto 02)
   strike = numero dello strike nel libro, p = prezzo sullo strumento */
function wallsOf(tk,metric){
 const i=INS[tk], m=metric||S.metric;
 const nW={'Off':0,'Top 3':3,'Top 5':5,'Top 10':5,'Top 15':5,'Top 25':5,'Top 40':5}[S.walls];
 const base=Math.round(((i.px-i.b)/i.k)/i.step)*i.step;
 const mult=m==='CEX'?0.42:m==='DEX'?-1.85:1;    // DEX cambia davvero i numeri
 return OFFS.slice(0,nW).map((o,n)=>{
  const strike=+(base+o*i.step).toFixed(4);
  const p=Math.round((strike*i.k+i.b)/i.tick)*i.tick;
  const sz=+(i.sz[n]*mult).toFixed(i.unit==='B'?1:0);
  return {strike,p,sz,st:STARS[n],unit:m==='DEX'?(i.unit==='B'?'B Δ':'M Δ'):i.unit};
 }).sort((a,b)=>b.p-a.p);
}
const szTxt=w=>(w.sz>0?'+':'')+w.sz+w.unit;

function render(){
 document.getElementById('mk').innerHTML=mkbar();
 document.getElementById('nt').innerHTML=noteHtml();
 document.getElementById('app').innerHTML = S.grid>1?viewGrid():viewOne();
 requestAnimationFrame(()=>{paint();observe();});
}

function pxAt(tk,cut){const p=series(tk);
 return p[Math.max(0,Math.min(p.length-1,Math.floor(cut*p.length)-1))][1];}
function dock(src,tk,px){
 tk=tk||S.tk; const i=INS[tk], d=i.dec, p=px||i.px, w=wallsOf(tk), src2=i.src;
 const head=`<div class="dhead">READS THE CHART<button class="dx" data-panels>✕</button></div>
  ${src?`<div class="dsrc"><i></i><b>${src}</b><span>ACTIVE WINDOW</span></div>`:''}`;
 if(!w.length) return `<aside class="dock">${head}<div class="dscroll">
   <div class="empty"><b>WALLS is off</b><span>Turn WALLS back on to read ${tk}.</span></div></div></aside>`;
 const above=w.filter(x=>x.p>p), below=w.filter(x=>x.p<=p);
 const idx=above.length;                            // w è ordinato dal più alto al più basso
 let ceil,flr;
 if(idx===0){ceil=w[0];flr=w[1]||w[0];}             // prezzo sopra ogni muro
 else if(idx===w.length){ceil=w[w.length-2]||w[0];flr=w[w.length-1];}
 else {ceil=w[idx-1];flr=w[idx];}
 const mag =w.filter(x=>x.sz>0).sort((a,b)=>Math.abs(a.p-p)-Math.abs(b.p-p))[0]||w[0];
 const piv =w.filter(x=>x.sz<0).sort((a,b)=>Math.abs(a.p-p)-Math.abs(b.p-p))[0]||w[0];
 const note=x=>src2?`<s>${src2} ${fmt(x.strike,x.strike%1?2:0)}</s>`:'';
 const li=x=>`<div class="lvl ${x.sz<0?'sq':'mag'}"><b>${fmt(x.p,d)}</b>${note(x)}
   <span>${x.sz<0?'breaks and runs':'magnet'} · ${szTxt(x)}</span></div>`;
 const M=S.metric;
 return `<aside class="dock">${head}<div class="dscroll">
  <section class="dsec"><h6>DIRECTION</h6>
   <div class="hero"><b>· NEUTRAL</b><span>${M} reading · score −0.1${S.replay?' · '+clockAt(S.rt)+' ET':''}</span></div>
   <div class="warn">🧲 MAGNET <b>${fmt(mag.p,d)}</b> ${src2?'('+src2+' '+fmt(mag.strike,mag.strike%1?2:0)+')':''} · ⚠<br>
    WEAK γ — no pin, BREAKOUT RISK (gravity unreliable today)</div>
  </section>
  <section class="dsec"><h6>THE PLAN</h6>
   <div class="card">
    <div class="lead">LEVELS · ${fmt(ceil.p,d)} ↔ ${fmt(flr.p,d)} · ${S.replay?'replay '+clockAt(S.rt)+' ET':'5h 14m to close'}</div>
    <div class="kv"><span>${idx?'CEILING':'BREAKOUT'}</span><b>${idx?`test <em>${fmt(ceil.p,d)}</em> · floor backstop <em>${fmt(flr.p,d)}</em>`:`above every wall · <em>${fmt(ceil.p,d)}</em> now acts as floor`}</b></div>
    <div class="kv"><span>TRADE</span><b>${idx?`fade ${fmt(ceil.p,d)} on touch · target midpoint ${fmt((ceil.p+flr.p)/2,d)}`:`buy the pullback to ${fmt(ceil.p,d)} · target ${fmt(p+(ceil.p-flr.p)*0.6,d)}`}</b></div>
    <div class="kv"><span>STOP</span><b>close ${idx?'above':'below'} ${fmt(idx?ceil.p+(ceil.p-flr.p)*0.12:ceil.p-(ceil.p-flr.p)*0.12,d)}</b></div>
    <div class="kv"><span>PIVOT</span><b><em>${fmt(piv.p,d)}</em> (${szTxt(piv)} short-γ)</b></div>
   </div>
  </section>
  <section class="dsec"><h6>PRICES THAT MATTER</h6>
   ${above.map(li).join('')}
   <div class="lvl now"><b>${fmt(p,d)}</b><span>price now</span></div>
   ${below.map(li).join('')}
  </section>
 </div></aside>`;}

/* ── grafico ── */
function paint(){
 const one=document.getElementById('c'); if(one) chart(one,S.tk,S.replay?S.rt:1);
 document.querySelectorAll('canvas.pc').forEach(c=>chart(c,c.dataset.tk,1,1));
 document.querySelectorAll('canvas.sc').forEach(c=>subchart(c,c.dataset.k));
}
function rndFrom(s){let x=s;return()=>{x=(x*1103515245+12345)&0x7fffffff;return x/0x7fffffff;};}
function series(tk){
 const i=INS[tk],rnd=rndFrom(tk.split('').reduce((a,c)=>a+c.charCodeAt(0),7)*13+3);
 const n=190;let v=0,raw=[];
 for(let k=0;k<n;k++){v=v*0.965+(rnd()-.5);raw.push(v);}      // ritorno alla media
 const mn=Math.min(...raw),mx=Math.max(...raw),span=(mx-mn)||1;
 const amp=i.px*0.0046;
 const norm=raw.map(x=>(x-raw[n-1])/span*amp+i.px);           // ultimo valore = prezzo
 const pts=[];
 for(let k=0;k<n;k++){const o=k?norm[k-1]:norm[0],c=norm[k],w=amp*0.055;
  const vol=(900+rnd()*2200)*(k>n*0.80?2.2+rnd()*3.4:1);
  pts.push([o,c,Math.max(o,c)+rnd()*w,Math.min(o,c)-rnd()*w,vol]);}
 return pts;
}
function subchart(cv,k){
 const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
 const W=Math.max(40,Math.round(r.width)),H=Math.max(20,Math.round(r.height));
 cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);

 g.strokeStyle='#141A24';g.setLineDash([2,4]);g.beginPath();g.moveTo(AXL,H/2+.5);g.lineTo(L,H/2+.5);g.stroke();g.setLineDash([]);

 else{for(let i=0;i<n;i++){if(i>cut)break;const h=(pts[i]/mx)*(H/2-8);

function chart(cv,tk,cut,mini){
 const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
 const W=Math.max(60,Math.round(r.width)),H=Math.max(60,Math.round(r.height));
 cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
 const i=INS[tk],d=i.dec;
 const AXL=mini?0:58, AXR=Math.min(96,W*0.13), L=W-AXR, TB=22, PT=12, PH=H-TB-PT;
 const pts=series(tk), w=wallsOf(tk);
 let hi=Math.max(...pts.map(v=>v[2])), lo=Math.min(...pts.map(v=>v[3]));
 w.forEach(x=>{hi=Math.max(hi,x.p);lo=Math.min(lo,x.p);});
 const pad=(hi-lo)*0.09; hi+=pad; lo-=pad;
 const Y=v=>PT+(hi-v)/(hi-lo)*PH, n=pts.length, bw=(L-AXL)/n, X=k=>AXL+k*bw;
 const vmax=Math.max(...pts.map(v=>v[4]))*4.2;
 const VY=v=>PT+PH-(v/vmax)*PH;
 // griglia
 g.strokeStyle='#121826';g.lineWidth=1;
 for(let k=0;k<=6;k++){const y=PT+k*PH/6;g.beginPath();g.moveTo(AXL,y+.5);g.lineTo(L,y+.5);g.stroke();}
 // mappa gamma
 if(S.maps){
  const g1=g.createLinearGradient(0,PT,0,PT+PH*0.34);
  g1.addColorStop(0,'rgba(204,88,88,.09)');g1.addColorStop(1,'rgba(204,88,88,0)');
  g.fillStyle=g1;g.fillRect(AXL,PT,L-AXL,PH*0.34);
  const s0=Math.floor(n*0.74*Math.min(1,cut)), rnd=rndFrom(431);
  for(let k=s0;k<n;k++){if(k>cut*n)break;const x=X(k),a=0.05+rnd()*0.20;
   const g2=g.createLinearGradient(0,Y(i.px),0,PT+PH);
   g2.addColorStop(0,'rgba(54,156,111,'+(a*0.75).toFixed(3)+')');g2.addColorStop(1,'rgba(54,156,111,0)');
   g.fillStyle=g2;g.fillRect(x,Y(i.px),Math.max(bw,1),PT+PH-Y(i.px));}
 }
 // volumi (scala a sinistra)
 for(let k=0;k<n;k++){if(k>cut*n)break;
  g.fillStyle=pts[k][1]>=pts[k][0]?'rgba(54,156,111,.30)':'rgba(204,88,88,.30)';
  g.fillRect(X(k)+bw*.14,VY(pts[k][4]),Math.max(bw*.72,1),PT+PH-VY(pts[k][4]));}
 // muri
 w.forEach(x=>{const col=x.sz<0?CY:GRN, y=Y(x.p);
  g.strokeStyle=col;g.globalAlpha=x.st===2?.85:x.st===1?.75:.55;
  g.lineWidth=x.st===2?4:x.st===1?3:1.4;
  g.beginPath();g.moveTo(AXL,y+.5);g.lineTo(L,y+.5);g.stroke();g.globalAlpha=1;});
 // liquidity tide
 if(S.tide){const rnd=rndFrom(7717);
  for(let k=0;k<26;k++){const kk=Math.floor(n*(0.52+rnd()*0.47));if(kk>cut*n)continue;
   const yv=lo+ (hi-lo)*(0.28+rnd()*0.5), y=Y(yv), ww=6+rnd()*30;
   g.strokeStyle='rgba(226,232,240,.55)';g.lineWidth=2.4;
   g.beginPath();g.moveTo(X(kk),y);g.lineTo(X(kk)+ww,y);g.stroke();}}
 // candele
 for(let k=0;k<n;k++){if(k>cut*n)break;
  const o=pts[k][0],c=pts[k][1],h=pts[k][2],l=pts[k][3],x=X(k)+bw/2,up=c>=o;
  g.strokeStyle=up?GRN:RED;g.fillStyle=up?'rgba(54,156,111,.92)':'rgba(204,88,88,.92)';
  g.lineWidth=1;g.beginPath();g.moveTo(x,Y(h));g.lineTo(x,Y(l));g.stroke();
  g.fillRect(x-bw*.3,Y(Math.max(o,c)),Math.max(bw*.6,1.2),Math.max(Math.abs(Y(o)-Y(c)),1.2));}
 // linea prezzo corrente
 const last=pts[Math.max(0,Math.min(n-1,Math.floor(cut*n)-1))][1];
 g.strokeStyle='rgba(127,212,232,.6)';g.setLineDash([4,4]);g.lineWidth=1;
 g.beginPath();g.moveTo(AXL,Y(last)+.5);g.lineTo(L,Y(last)+.5);g.stroke();g.setLineDash([]);
 /* etichette muri — punto 07: sempre pallino · stelle · prezzo · dimensione,
    sempre dentro l'area del grafico, mai sopra la scala dei prezzi */
 w.forEach(x=>{const col=x.sz<0?CY:GRN, y=Y(x.p);
  const stars=x.st===2?'★★ ':x.st===1?'★ ':'';
  const tx='● '+stars+fmt(x.p,d)+'   '+szTxt(x);
  g.font='600 '+(mini?9.5:10.5)+'px "IBM Plex Mono",monospace';
  const tw=g.measureText(tx).width+14, bx=Math.max(AXL+4,L-tw-6);
  g.fillStyle='rgba(9,13,19,.93)';g.beginPath();g.roundRect(bx,y-9,tw,18,4);g.fill();
  g.strokeStyle=col;g.lineWidth=1;g.stroke();
  g.fillStyle=col;g.fillText(tx,bx+7,y+4);});
 // linea replay
 if(cut<1){const x=X(Math.floor(cut*n));
  g.strokeStyle=RED;g.setLineDash([5,4]);g.lineWidth=1;
  g.beginPath();g.moveTo(x,PT-6);g.lineTo(x,PT+PH);g.stroke();g.setLineDash([]);
  g.fillStyle=RED;g.beginPath();g.roundRect(x+4,PT-6,88,17,4);g.fill();
  g.fillStyle='#0A0E14';g.font='600 9.5px "IBM Plex Mono",monospace';g.fillText('▶ '+clockAt(cut)+' ET',x+10,PT+6);}
 // scala volumi a sinistra
 if(AXL){g.font='9.5px "IBM Plex Mono",monospace';g.fillStyle='#414C60';
  const raw=vmax/9, pow=Math.pow(10,Math.floor(Math.log10(raw)));
  const stp=[1,2,2.5,5,10].map(m=>m*pow).find(v=>v>=raw)||pow*10;
  for(let v=stp;v<vmax;v+=stp){const y=VY(v);if(y<PT+6)break;
   g.fillText((v>=1000?Math.round(v/1000)+'K':Math.round(v)),6,y+4);}}
 // scala prezzi a destra
 g.fillStyle='#0A0E14';g.fillRect(L,0,AXR,H);
 g.strokeStyle='#1B2230';g.beginPath();g.moveTo(L+.5,0);g.lineTo(L+.5,H);g.stroke();
 g.font='10.5px "IBM Plex Mono",monospace';g.fillStyle='#7C879A';
 for(let k=0;k<=8;k++){const v=hi-(hi-lo)*k/8;g.fillText(fmt(v,d),L+8,PT+k*PH/8+4);}
 g.fillStyle=CY;g.beginPath();g.roundRect(L,Y(last)-9,AXR,18,3);g.fill();
 g.fillStyle='#0A0E14';g.font='600 10.5px "IBM Plex Mono",monospace';g.fillText(fmt(last,d),L+8,Y(last)+4);
 // asse dei tempi
 g.fillStyle='#5D6A82';g.font='9.5px "IBM Plex Mono",monospace';
 ['03:00','04:00','05:00','06:00','07:00','08:00','09:00','10:00'].forEach((t,k,a)=>{
  const x=AXL+k*(L-AXL-34)/(a.length-1);g.fillText(t,x,H-7);});
}

document.addEventListener('click',e=>{

 if(tl){const r=tl.getBoundingClientRect();S.rt=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  S.replay=S.rt<0.995?1:0;S.demo=0;return render();}
 const t=e.target.closest('button'); if(!t){S.open=null;S.ask=0;return render();}
 const d=t.dataset;
 if(d.demo!==undefined) return demo(+d.demo);
 if(d.fly!==undefined){S.open=S.open===d.fly?null:d.fly;}
 else if(d.set!==undefined){S[d.set]=d.val; if(['tk','tf','walls','metric','exp'].includes(d.set))S.open=null;}
 else if(d.grid!==undefined){S.grid=+d.grid;S.open=null;S.ask=0;}
 else if(d.tog!==undefined){S[d.tog]=S[d.tog]?0:1;}
 else if(d.panels!==undefined){S.panels=S.panels?0:1;S.open=null;}
 else if(d.askpanels!==undefined){S.ask=S.ask?0:1;S.open=null;}
 else if(d.pick!==undefined){S.act=+d.pick;S.ask=0;S.panels=1;}
 else if(d.live!==undefined){S.replay=d.live==='1'?0:1;S.playing=0;if(!S.replay)S.rt=1;else if(S.rt>=1)S.rt=0.52;}
 else if(d.play!==undefined){S.playing=S.playing?0:1;}
 else if(d.step!==undefined){if(!S.replay){S.replay=1;S.rt=0.52;}
  S.rt=Math.min(1,Math.max(0.04,S.rt+(+d.step)*0.02));}
 else if(d.hide!==undefined){}
 else if(d.alloff!==undefined){S.tide=0;S.cvd=0;S.cdi=0;S.maps=0;S.proj=0;S.oi=0;S.open=null;}
 else S.open=null;
 render();});
